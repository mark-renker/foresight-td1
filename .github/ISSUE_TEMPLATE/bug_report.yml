name: Bug report
description: Something sounds, looks or behaves wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you heard/saw vs. what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Insert on snare track\n2. Load 'Snare - Crack'\n3. ..."
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host + version
      placeholder: Ableton Live 12.1, Logic 11, Reaper 7...
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options: [AU, VST3, CLAP, Standalone]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS / CPU / sample rate / buffer size
      placeholder: macOS 15.2, M2, 48 kHz, 128
  - type: input
    id: version
    attributes:
      label: TD-1 version
      placeholder: 0.4.0
  - type: textarea
    id: extra
    attributes:
      label: Audio, screenshots, preset files
      description: Attach a short bounce or a .td1preset if it helps.
